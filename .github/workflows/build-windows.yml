name: Build EXE for Windows and macOS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            output_name: AutoInteractionTool_Windows.exe
            pyinstaller_args: --onefile --windowed --icon=icon.ico
            artifact_name: Windows-Executable
            artifact_path: dist/main.exe
          - os: macos-latest
            output_name: AutoInteractionTool_macOS.app
            pyinstaller_args: --onefile --windowed
            artifact_name: macOS-Application
            artifact_path: dist/main.app

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm ${{ matrix.pyinstaller_args }} main.py
      shell: bash

    - name: Rename output (optional)
      run: |
        mv ${{ matrix.artifact_path }} ${{ matrix.output_name }} || true
      shell: bash

    - name: Upload artifact
      uses: actions/upload-artifact@v6
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.output_name }}
